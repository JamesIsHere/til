name: Validate and build index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: post dates come from git log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate posts
        run: python validate_post.py
      - name: Rebuild README index
        run: python build_index.py
      - name: Commit README if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Rebuild README index [skip ci]"
            git push
          fi
